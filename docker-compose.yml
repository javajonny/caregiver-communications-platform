services:
  db:
    image: postgres:16
    container_name: caregiver_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/New_York
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data
      # Auto-initialize the schema on first run
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Optional: keep a copy accessible inside container for manual apply
      - ./database/schema.sql:/schema/schema.sql:ro

  server:
    build: ./server
    container_name: caregiver_server
    depends_on:
      db:
        condition: service_healthy
    environment:
      # For future DB usage in app code
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/New_York
      # Set FAKE_NOW here only when testing a specific date/time.
    ports:
      - "8443:8443"
    volumes:
      # Mount certs for TLS
      - ./server/cert.pem:/certs/cert.pem:ro
      - ./server/key.pem:/certs/key.pem:ro
      # For dev hot-reload: mount code (optional but enabled here)
      - ./server:/app
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8443", "--ssl-keyfile", "/certs/key.pem", "--ssl-certfile", "/certs/cert.pem", "--reload" ]
    restart: unless-stopped

  portal:
    build:
      context: ./portal/caregiver-mgmt-portal
    container_name: caregiver_portal
    depends_on:
      - server
    ports:
      - "3000:443"
    volumes:
      - ./server/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./server/key.pem:/etc/nginx/certs/key.pem:ro
    restart: unless-stopped

  # =============================================
  # BACKUP SERVICE 
  # =============================================
  # Runs daily encrypted backups of the database
  # Backups stored in ./backups directory
  # To restore: ./scripts/restore_backup.sh <backup_file>
  backup:
    image: postgres:16
    container_name: caregiver_backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-changeme}
      TZ: America/New_York
    volumes:
      - ./backups:/backups
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        echo "Backup service started. Running daily at 2 AM."
        while true; do
          # Calculate seconds until 2 AM
          now=$$(date +%s)
          target=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -v+1d -v2H -v0M -v0S +%s)
          sleep_seconds=$$((target - now))
          if [ $$sleep_seconds -lt 0 ]; then
            sleep_seconds=$$((sleep_seconds + 86400))
          fi
          echo "Next backup in $$sleep_seconds seconds..."
          sleep $$sleep_seconds

          # Run backup
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          BACKUP_FILE="/backups/backup_$${TIMESTAMP}.sql.gz.enc"
          echo "Creating backup: $${BACKUP_FILE}"
          
          pg_dump -h db -U $${POSTGRES_USER} --clean --if-exists $${POSTGRES_DB} | \
            gzip | \
            openssl enc -aes-256-cbc -salt -pbkdf2 -pass pass:$${BACKUP_ENCRYPTION_KEY} \
            > $${BACKUP_FILE}
          
          if [ $$? -eq 0 ]; then
            echo "Backup completed: $${BACKUP_FILE}"
            # Rotate old backups (keep 6 years for HIPAA compliance)
            find /backups -name "backup_*.sql.gz.enc" -mtime +2190 -delete
            echo "Old backups cleaned up."
          else
            echo "ERROR: Backup failed!"
          fi
        done
    restart: unless-stopped

volumes:
  db_data:
